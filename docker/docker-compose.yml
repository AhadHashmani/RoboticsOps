version: '3.8'\n\nservices:\n  api:\n    build:\n      context: ..\n      dockerfile: docker/Dockerfile\n    ports:\n      - \"8000:8000\"\n    environment:\n      - RUN_MODE=api\n      - DB_HOST=postgres\n    depends_on:\n      - postgres\n    volumes:\n      - ..:/app\n\n  dashboard:\n    build:\n      context: ..\n      dockerfile: docker/Dockerfile\n    ports:\n      - \"8501:8501\"\n    environment:\n      - RUN_MODE=dashboard\n    volumes:\n      - ..:/app\n\n  agent:\n    build:\n      context: ..\n      dockerfile: docker/Dockerfile\n    environment:\n      - RUN_MODE=agent\n      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}\n    volumes:\n      - ..:/app\n\n  postgres:\n    image: postgres:15\n    environment:\n      POSTGRES_DB: roboticsops\n      POSTGRES_USER: roboticsops\n      POSTGRES_PASSWORD: secure_password\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\nvolumes:\n  postgres_data:\n